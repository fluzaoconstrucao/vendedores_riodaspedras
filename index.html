<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords"
    content="Fluzão Materiais, loja de construção, materiais de construção, cimento, areia, tijolo, tinta, ferramentas, construção civil, reforma, hidráulica, elétrica" />
  <meta property="og:title" content="Fluzão Materiais de Construção | Tudo para Sua Obra no RJ" />
  <meta property="og:description"
    content="Na Fluzão Materiais de Construção você encontra tudo para sua obra: cimento, areia, tijolos, tintas, elétrica, hidráulica e muito mais. Entregamos em todo o Rio de Janeiro!" />
  <meta property="og:url" content="https://www.fluzaoconstrucao.com.br/" />
  <meta property="og:image" content="https://www.fluzaoconstrucao.com.br/imagens/banner-principal.jpg" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Fluzão Materiais de Construção" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Fluzão Materiais de Construção | Reforma & Decoração</title>

  <style>
    /* ======= RESET ======= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    /* ======= HEADER ======= */
    header {
      text-align: center;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    header img {
      height: 70px;
      margin-bottom: 10px;
    }

    header h2 {
      font-size: 18px;
      color: #333;
    }

    /* ======= MAIN ======= */
    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .vendedor {
      background: #f5f5f5; /* mesma cor do fundo da página */
      border-radius: 10px;
      width: 260px;
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 15px;
    }

    .vendedor:hover {
      transform: scale(1.03);
    }

    .vendedor img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .info h3 {
      color: #222;
      margin-bottom: 5px;
      font-size: 18px;
    }

    .info p {
      margin-bottom: 10px;
      font-weight: bold;
      color: #555;
    }

    .botao {
      display: inline-block;
      background: #25d366;
      color: #fff;
      padding: 8px 18px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.3s ease;
      font-size: 15px;
    }

    .botao:hover {
      background: #1ebe57;
    }

    /* ======= FOOTER ======= */
    footer {
      text-align: center;
      padding: 20px;
      background: #fff;
      color: #555;
      font-size: 14px;
      border-top: 1px solid #ddd;
      margin-top: 40px;
    }

    /* ======= RESPONSIVIDADE ======= */
    @media (max-width: 768px) {
      .vendedor {
        width: 100%;
        max-width: 350px;
      }

      .vendedor img {
        width: 120px;
        height: 120px;
      }

      header h2 {
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      header img {
        height: 60px;
      }

      header h2 {
        font-size: 15px;
      }

      .vendedor img {
        width: 110px;
        height: 110px;
      }
    }
  </style>
</head>

<body>

  <header>
    <img src="images/logo-fluzao-1.webp" alt="Logo Fluzão Materiais de Construção">
    <h2>Precisando de orçamento?<br>Fale com um de nossos vendedores!</h2>
  </header>

  <main>
    <div class="vendedor">
      <img src="images/jonas.jpg" alt="Foto do vendedor Jonas">
      <div class="info">
        <h3>Jonas Lima</h3>
        <p>(21) 98259-5104</p>
        <a class="botao" href="https://wa.me/5521982595104?text=Olá,%20gostaria%20de%20fazer%20um%20orçamento."
          target="_blank">Chamar vendedor</a>
      </div>
    </div>

    <div class="vendedor">
      <img src="images/igorsantos.jpg" alt="Foto do vendedor Igor Santos">
      <div class="info">
        <h3>Igor Santos</h3>
        <p>(21) 99844-7486</p>
        <a class="botao" href="https://wa.me/5521980098214?text=Olá,%20gostaria%20de%20fazer%20um%20orçamento."
          target="_blank">Chamar vendedor</a>
      </div>

      <div class="vendedor">
      <img src="images/renan.png" alt="Foto do vendedor Renan">
      <div class="info">
        <h3>Renan</h3>
        <p>(21) 99844-7486</p>
        <a class="botao" href="https://wa.me/5521998447486?text=Olá,%20gostaria%20de%20fazer%20um%20orçamento."
          target="_blank">Chamar vendedor</a>
      </div>

    </div>
  </main>

  <footer>
    <p>Fluzão Construção 2025.<br>Todos os direitos reservados.</p>
  </footer>

</body>

</html>
